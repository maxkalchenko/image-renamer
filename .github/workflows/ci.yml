name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check --output-format=github .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      # Keep in step with the gitleaks rev in .pre-commit-config.yaml.
      GITLEAKS_VERSION: 8.30.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      # Scans every commit on every run, so the first push needs no special case.
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
